name: Build & Test

on:
  push:
    branches: [ main, "cursor/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

      - name: Test
        run: dotnet test --no-build --configuration ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} --verbosity normal

      - name: Upload MSIX package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: CommandPaletteObsidian-${{ matrix.platform }}
          path: src/CommandPaletteObsidian/AppPackages/**/*.msix
          if-no-files-found: warn

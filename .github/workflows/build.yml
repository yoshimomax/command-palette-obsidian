name: Build & Test

on:
  push:
    branches: [ main, "cursor/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Create self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Dev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "CommandPaletteObsidian Dev Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          $pfxPassword = ConvertTo-SecureString -String "CmdPalObsidian2024" -Force -AsPlainText
          $pfxPath = "src/CommandPaletteObsidian/CommandPaletteObsidian_TemporaryKey.pfx"
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath $pfxPath -Password $pfxPassword
          Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath "CommandPaletteObsidian.cer"

          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        shell: pwsh
        run: |
          dotnet build --no-restore --configuration ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT

      - name: Test
        run: dotnet test --no-build --configuration ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} --verbosity normal

      - name: Upload MSIX package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: CommandPaletteObsidian-${{ matrix.platform }}
          path: |
            src/CommandPaletteObsidian/bin/**/AppPackages/**/*.msix
            CommandPaletteObsidian.cer
          if-no-files-found: warn
